<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการข้อมูล Google Sheets</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; padding: 20px; }
        .container { max-width: 1300px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        h1 { color: #1a237e; border-bottom: 3px solid #4285f4; padding-bottom: 10px; margin-bottom: 20px; }
        .status-bar { background: #e8f0fe; padding: 12px 18px; border-radius: 8px; margin-bottom: 20px; display: flex; justify-content: space-between; flex-wrap: wrap; align-items: center; }
        .status-text { color: #1a237e; font-weight: 500; }
        .badge { background: #34a853; color: white; padding: 4px 14px; border-radius: 20px; font-size: 13px; }
        .toolbar { margin-bottom: 15px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
        .btn { padding: 8px 18px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .btn-primary { background: #4285f4; color: white; }
        .btn-primary:hover { background: #3367d6; }
        .btn-success { background: #34a853; color: white; }
        .btn-success:hover { background: #2d9248; }
        .btn-danger { background: #ea4335; color: white; }
        .btn-danger:hover { background: #d33426; }
        .btn-warning { background: #fbbc04; color: #333; }
        .btn-warning:hover { background: #f9ab00; }
        .btn-secondary { background: #9e9e9e; color: white; }
        .btn-secondary:hover { background: #757575; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .table-wrapper { overflow-x: auto; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { background: #1a237e; color: white; padding: 10px 12px; text-align: left; white-space: nowrap; position: sticky; top: 0; z-index: 10; }
        td { border: 1px solid #e0e0e0; padding: 6px 8px; }
        td input { width: 100%; padding: 6px 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; transition: 0.2s; }
        td input:focus { border-color: #4285f4; outline: none; box-shadow: 0 0 0 3px rgba(66,133,244,0.2); }
        .action-cell { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; }
        .action-cell .btn { padding: 4px 10px; font-size: 12px; }
        .message { padding: 10px 15px; border-radius: 6px; margin-top: 15px; display: none; }
        .message.success { background: #e6f4ea; color: #1e7e34; display: block; }
        .message.error { background: #fce8e6; color: #c62828; display: block; }
        .message.loading { background: #fff8e1; color: #f57c00; display: block; }
        #loading { text-align: center; padding: 40px 0; font-size: 18px; color: #666; }
        .input-group { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .input-group input[type="number"] { width: 80px; padding: 6px; border: 1px solid #ccc; border-radius: 4px; }
        .badge-email { background: #e8f0fe; color: #1a237e; padding: 2px 12px; border-radius: 12px; font-size: 13px; }
        @media (max-width: 600px) { .container { padding: 15px; } .status-bar { flex-direction: column; align-items: flex-start; gap: 8px; } }
    </style>
</head>
<body>
<div class="container">
    <h1>📊 ระบบจัดการข้อมูล Google Sheets</h1>

    <div class="status-bar">
        <span class="status-text" id="statusText">🟢 พร้อมใช้งาน</span>
        <div>
            <span class="badge" id="rowCount">0 แถว</span>
            <span class="badge-email" id="userEmail">👤 ไม่ระบุ</span>
        </div>
    </div>

    <div class="toolbar">
        <button class="btn btn-success" onclick="refreshData()">🔄 โหลดใหม่</button>
        <button class="btn btn-primary" onclick="addRow()">➕ เพิ่ม 1 แถว</button>
        <button class="btn btn-warning" onclick="addMultipleRows()">➕➕ เพิ่มหลายแถว</button>
        <button class="btn btn-danger" onclick="saveAllRows()">💾 บันทึกทั้งหมด</button>
        <button class="btn btn-secondary" onclick="resetAllRows()">↩️ คืนค่าทั้งหมด</button>
    </div>

    <div id="loading">⏳ กำลังโหลดข้อมูล...</div>

    <div class="table-wrapper" id="tableWrapper" style="display:none;">
        <table id="dataTable">
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <div id="message" class="message"></div>
</div>

<script>
    // ============================================================
    //  CONFIG - แก้ไขเฉพาะส่วนนี้ให้ตรงกับการตั้งค่าของคุณ
    // ============================================================
    const CONFIG = {
        API_URL: 'https://script.google.com/macros/s/AKfycbzl10X4ZjVethwHAhPlfFJCh_iFAnBFl1AAK8F7xsxtIiRHvdPOZtK0jEc6Z4x510ug/exec', // เปลี่ยน
        API_KEY: 's8d7f6g5h4j3k2l1',                                     // เปลี่ยน
        USER_EMAIL: 'your-email@gmail.com'                               // ใช้สำหรับส่งให้ GAS ตรวจสอบ (ถ้ามี)
    };

    // ============================================================
    //  ตัวแปรกลาง
    // ============================================================
    let currentData = [];
    let originalData = [];
    let isDirty = false;

    // ============================================================
    //  ฟังก์ชันหลัก
    // ============================================================

    async function loadData() {
        showMessage('กำลังโหลดข้อมูล...', 'loading');
        document.getElementById('loading').style.display = 'block';
        document.getElementById('tableWrapper').style.display = 'none';

        try {
            const url = `${CONFIG.API_URL}?key=${CONFIG.API_KEY}&email=${encodeURIComponent(CONFIG.USER_EMAIL)}`;
            const resp = await fetch(url);
            const result = await resp.json();

            if (result.status === 'success') {
                currentData = result.data;
                originalData = JSON.parse(JSON.stringify(currentData));
                renderTable(currentData);
                document.getElementById('rowCount').textContent = `${currentData.length - 1} แถว`;
                showMessage('โหลดข้อมูลสำเร็จ', 'success');
                markClean();
            } else {
                throw new Error(result.message || 'Unknown error');
            }
        } catch (err) {
            showMessage('❌ โหลดข้อมูลล้มเหลว: ' + err.message, 'error');
            console.error(err);
        } finally {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('tableWrapper').style.display = 'block';
        }
    }

    function renderTable(data) {
        if (!data || data.length === 0) {
            document.getElementById('tableBody').innerHTML = '<tr><td colspan="10" style="text-align:center;padding:30px;">ไม่มีข้อมูล</td></tr>';
            return;
        }

        const headers = data[0];
        let thead = '<tr>';
        headers.forEach(h => thead += `<th>${h || 'คอลัมน์'}</th>`);
        thead += '<th style="width:160px;">จัดการ</th></tr>';
        document.getElementById('tableHead').innerHTML = thead;

        let tbody = '';
        for (let i = 1; i < data.length; i++) {
            const row = data[i];
            tbody += '<tr>';
            for (let j = 0; j < row.length; j++) {
                const val = (row[j] !== undefined && row[j] !== null) ? row[j] : '';
                tbody += `<td><input type="text" id="cell_${i}_${j}" value="${escapeHtml(String(val))}" onchange="markDirty()"></td>`;
            }
            tbody += `<td>
                <div class="action-cell">
                    <button class="btn btn-success btn-sm" onclick="saveRow(${i})">💾</button>
                    <button class="btn btn-primary btn-sm" onclick="resetRow(${i})">↩️</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteRow(${i})">🗑️</button>
                </div>
            </td></tr>`;
        }
        document.getElementById('tableBody').innerHTML = tbody;
    }

    // บันทึก 1 แถว
    async function saveRow(rowIndex) {
        const rowData = getRowData(rowIndex);
        if (!rowData) return;

        showMessage(`⏳ กำลังบันทึกแถว ${rowIndex}...`, 'loading');
        try {
            const resp = await fetch(`${CONFIG.API_URL}?key=${CONFIG.API_KEY}&email=${encodeURIComponent(CONFIG.USER_EMAIL)}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'updateRow', rowIndex, rowData })
            });
            const result = await resp.json();
            if (result.status === 'success') {
                showMessage(`✅ ${result.message}`, 'success');
                originalData[rowIndex] = [...rowData];
                markClean();
            } else {
                throw new Error(result.message);
            }
        } catch (err) {
            showMessage(`❌ บันทึกแถว ${rowIndex} ล้มเหลว: ${err.message}`, 'error');
        }
    }

    // เพิ่ม 1 แถว
    async function addRow() {
        const headers = currentData[0] || [];
        const newRow = headers.map((_, idx) => `ค่า ${idx+1}`);
        showMessage('⏳ กำลังเพิ่มแถว...', 'loading');
        try {
            const resp = await fetch(`${CONFIG.API_URL}?key=${CONFIG.API_KEY}&email=${encodeURIComponent(CONFIG.USER_EMAIL)}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'addRow', rowData: newRow })
            });
            const result = await resp.json();
            if (result.status === 'success') {
                showMessage(`✅ ${result.message}`, 'success');
                await loadData();
            } else {
                throw new Error(result.message);
            }
        } catch (err) {
            showMessage(`❌ เพิ่มแถวล้มเหลว: ${err.message}`, 'error');
        }
    }

    // เพิ่มหลายแถว (ถามจำนวน)
    async function addMultipleRows() {
        const count = prompt('ต้องการเพิ่มกี่แถว?', '3');
        if (!count || isNaN(count) || count < 1) return;
        const num = parseInt(count);
        const headers = currentData[0] || [];
        const rows = [];
        for (let r = 0; r < num; r++) {
            rows.push(headers.map((_, idx) => `แถวใหม่ ${r+1}-${idx+1}`));
        }
        showMessage(`⏳ กำลังเพิ่ม ${num} แถว...`, 'loading');
        try {
            const resp = await fetch(`${CONFIG.API_URL}?key=${CONFIG.API_KEY}&email=${encodeURIComponent(CONFIG.USER_EMAIL)}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'addMultipleRows', rowsData: rows })
            });
            const result = await resp.json();
            if (result.status === 'success') {
                showMessage(`✅ ${result.message}`, 'success');
                await loadData();
            } else {
                throw new Error(result.message);
            }
        } catch (err) {
            showMessage(`❌ เพิ่มหลายแถวล้มเหลว: ${err.message}`, 'error');
        }
    }

    // ลบแถว
    async function deleteRow(rowIndex) {
        if (!confirm(`คุณแน่ใจที่จะลบแถวที่ ${rowIndex}?`)) return;
        showMessage(`⏳ กำลังลบแถว ${rowIndex}...`, 'loading');
        try {
            const resp = await fetch(`${CONFIG.API_URL}?key=${CONFIG.API_KEY}&email=${encodeURIComponent(CONFIG.USER_EMAIL)}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'deleteRow', rowIndex })
            });
            const result = await resp.json();
            if (result.status === 'success') {
                showMessage(`✅ ${result.message}`, 'success');
                await loadData();
            } else {
                throw new Error(result.message);
            }
        } catch (err) {
            showMessage(`❌ ลบแถว ${rowIndex} ล้มเหลว: ${err.message}`, 'error');
        }
    }

    // บันทึกทั้งหมด (ทีละแถว)
    async function saveAllRows() {
        if (!isDirty) {
            showMessage('ℹ️ ไม่มีการเปลี่ยนแปลง', 'success');
            return;
        }
        showMessage('⏳ กำลังบันทึกทั้งหมด...', 'loading');
        let successCount = 0;
        let errorCount = 0;
        for (let i = 1; i < currentData.length; i++) {
            const rowData = getRowData(i);
            if (!rowData) continue;
            try {
                const resp = await fetch(`${CONFIG.API_URL}?key=${CONFIG.API_KEY}&email=${encodeURIComponent(CONFIG.USER_EMAIL)}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'updateRow', rowIndex: i, rowData })
                });
                const result = await resp.json();
                if (result.status === 'success') {
                    successCount++;
                    originalData[i] = [...rowData];
                } else {
                    errorCount++;
                }
            } catch (err) {
                errorCount++;
            }
        }
        if (errorCount === 0) {
            showMessage(`✅ บันทึกทั้งหมด ${successCount} แถวสำเร็จ`, 'success');
            markClean();
        } else {
            showMessage(`⚠️ บันทึกสำเร็จ ${successCount} แถว, ล้มเหลว ${errorCount} แถว`, 'error');
        }
    }

    // คืนค่าทั้งหมด (ยกเลิกการแก้ไข)
    function resetAllRows() {
        if (!isDirty) {
            showMessage('ℹ️ ไม่มีการเปลี่ยนแปลง', 'success');
            return;
        }
        if (!confirm('คืนค่าทั้งหมด? การเปลี่ยนแปลงที่ยังไม่ได้บันทึกจะหายไป')) return;
        renderTable(originalData);
        currentData = JSON.parse(JSON.stringify(originalData));
        markClean();
        showMessage('↩️ คืนค่าทั้งหมดแล้ว', 'success');
    }

    // ============================================================
    //  ฟังก์ชันช่วยเหลือ
    // ============================================================

    function getRowData(rowIndex) {
        const cols = currentData[0].length;
        const data = [];
        for (let j = 0; j < cols; j++) {
            const input = document.getElementById(`cell_${rowIndex}_${j}`);
            data.push(input ? input.value : '');
        }
        return data;
    }

    function resetRow(rowIndex) {
        if (originalData[rowIndex]) {
            const row = originalData[rowIndex];
            for (let j = 0; j < row.length; j++) {
                const input = document.getElementById(`cell_${rowIndex}_${j}`);
                if (input) input.value = (row[j] !== undefined && row[j] !== null) ? row[j] : '';
            }
            showMessage(`↩️ คืนค่าแถว ${rowIndex} แล้ว`, 'success');
        }
    }

    function refreshData() { loadData(); }

    function markDirty() {
        isDirty = true;
        document.getElementById('statusText').textContent = '🟡 มีการเปลี่ยนแปลง (ยังไม่บันทึก)';
    }

    function markClean() {
        isDirty = false;
        document.getElementById('statusText').textContent = '🟢 พร้อมใช้งาน';
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function showMessage(msg, type) {
        const el = document.getElementById('message');
        el.textContent = msg;
        el.className = 'message ' + type;
        el.style.display = 'block';
        if (type !== 'loading') {
            setTimeout(() => { el.style.display = 'none'; }, 5000);
        }
    }

    // ============================================================
    //  เริ่มต้น
    // ============================================================
    window.onload = function() {
        loadData();
        document.getElementById('userEmail').textContent = '👤 ' + (CONFIG.USER_EMAIL || 'ไม่ระบุ');
    };
</script>
</body>
</html>
