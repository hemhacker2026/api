<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Google Sheets CRUD - Frontend</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        button { margin: 5px; padding: 10px; cursor: pointer; }
        pre { background: #f4f4f4; padding: 15px; border-radius: 5px; }
        .container { max-width: 800px; margin: 0 auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Google Sheets Data Manager</h1>
        
        <!-- Action Buttons -->
        <button onclick="fetchData()">📖 Read Data</button>
        <button onclick="addData()">➕ Add Row</button>
        <button onclick="updateData()">✏️ Update Row</button>
        <button onclick="deleteData()">🗑️ Delete Row</button>
        <button onclick="clearAll()">🧹 Clear All Data</button>
        
        <hr>
        
        <!-- Result Display -->
        <h3>📋 Result:</h3>
        <pre id="result">Click a button to start...</pre>
    </div>

    <script>
        // ============================================================
        // CONFIGURATION (ต้องตรงกับที่ตั้งใน Worker)
        // ============================================================
        const PROXY_URL = 'https://my-sheet-proxy.[your-username].workers.dev/api/data';
        const API_SECRET = 'MySuperSecretKey123!@#'; // ต้องตรงกับ env.API_SECRET
        
        // Helper: แสดงผลลัพธ์
        function showResult(data) {
            document.getElementById('result').textContent = JSON.stringify(data, null, 2);
        }

        // Helper: จัดการ Error
        async function handleResponse(response) {
            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.error || 'Unknown error');
            }
            return data;
        }

        // ----- 1. READ: ดึงข้อมูลทั้งหมด -----
        async function fetchData() {
            try {
                const response = await fetch(PROXY_URL, {
                    method: 'GET',
                    headers: { 'X-API-Secret': API_SECRET }
                });
                const data = await handleResponse(response);
                showResult(data);
            } catch (error) {
                showResult({ error: error.message });
            }
        }

        // ----- 2. CREATE: เพิ่มข้อมูลใหม่ -----
        async function addData() {
            const newRow = ['สินค้าใหม่', 99, 'ตัว'];
            try {
                const response = await fetch(PROXY_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-API-Secret': API_SECRET
                    },
                    body: JSON.stringify({ rowData: newRow })
                });
                const data = await handleResponse(response);
                showResult(data);
                // Refresh data after adding
                await fetchData();
            } catch (error) {
                showResult({ error: error.message });
            }
        }

        // ----- 3. UPDATE: แก้ไขข้อมูล (index 0-based) -----
        async function updateData() {
            const index = 0; // แถวแรก (หลังจากหัวตาราง)
            const updatedRow = ['สินค้าเก่า (แก้ไข)', 200, 'โหล'];
            try {
                const response = await fetch(`${PROXY_URL}/${index}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-API-Secret': API_SECRET
                    },
                    body: JSON.stringify({ rowData: updatedRow })
                });
                const data = await handleResponse(response);
                showResult(data);
                await fetchData();
            } catch (error) {
                showResult({ error: error.message });
            }
        }

        // ----- 4. DELETE: ลบข้อมูล (index 0-based) -----
        async function deleteData() {
            const index = 0; // แถวแรก (หลังจากหัวตาราง)
            try {
                const response = await fetch(`${PROXY_URL}/${index}`, {
                    method: 'DELETE',
                    headers: { 'X-API-Secret': API_SECRET }
                });
                const data = await handleResponse(response);
                showResult(data);
                await fetchData();
            } catch (error) {
                showResult({ error: error.message });
            }
        }

        // ----- 5. CLEAR: ลบข้อมูลทั้งหมด (DELETE ทีละแถว) -----
        async function clearAll() {
            if (!confirm('Are you sure you want to delete ALL data?')) return;
            try {
                // First, get total rows
                const response = await fetch(PROXY_URL, {
                    headers: { 'X-API-Secret': API_SECRET }
                });
                const data = await response.json();
                const totalRows = data.data ? data.data.length : 0;
                
                // Delete from last to first
                for (let i = totalRows - 1; i >= 0; i--) {
                    await fetch(`${PROXY_URL}/${i}`, {
                        method: 'DELETE',
                        headers: { 'X-API-Secret': API_SECRET }
                    });
                }
                showResult({ message: `Deleted ${totalRows} rows successfully` });
                await fetchData();
            } catch (error) {
                showResult({ error: error.message });
            }
        }

        // Load data automatically on page load
        window.onload = fetchData;
    </script>
</body>
</html>
