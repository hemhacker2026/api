<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการสมาชิก</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #4CAF50; color: white; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏋️ ระบบจัดการสมาชิกฟิตเนส</h1>
            <div>
                <button onclick="loadData('بيانات الأعضاء')">📊 สมาชิก</button>
                <button onclick="loadData('سجل دخول الجيم')">📅 การเข้า</button>
                <button onclick="loadData('سجل المدفوعات')">💰 การชำระเงิน</button>
                <button onclick="loadData('لوحة التحكم')">⚙️ แผงควบคุม</button>
            </div>
        </div>
        <hr>
        <h3 id="sheetTitle">📋 ข้อมูลสมาชิก</h3>
        <div id="tableContainer"></div>
        <hr>
        <div id="result"></div>
    </div>

    <script>
        // ============================================
        // ตั้งค่า
        // ============================================
        const PROXY_URL = 'https://soft-hat-639a.hem5426.workers.dev/api/data';
        const API_SECRET = 'MySuperSecretKey84265!@#';

        // ============================================
        // โหลดข้อมูล
        // ============================================
        async function loadData(sheetName) {
            const url = `${PROXY_URL}?sheet=${encodeURIComponent(sheetName)}`;
            document.getElementById('sheetTitle').textContent = `📋 ${sheetName}`;

            try {
                const response = await fetch(url, {
                    headers: { 'X-API-Secret': API_SECRET }
                });
                const data = await response.json();

                if (data.success && data.data) {
                    renderTable(data.data);
                    document.getElementById('result').textContent = JSON.stringify(data, null, 2);
                } else {
                    document.getElementById('tableContainer').innerHTML = `<p>❌ ไม่พบข้อมูล: ${data.error || 'Unknown error'}</p>`;
                }
            } catch (error) {
                document.getElementById('tableContainer').innerHTML = `<p>❌ Error: ${error.message}</p>`;
            }
        }

        // ============================================
        // แสดงผลเป็นตาราง
        // ============================================
        function renderTable(data) {
            if (!data || data.length === 0) {
                document.getElementById('tableContainer').innerHTML = '<p>📭 ไม่มีข้อมูล</p>';
                return;
            }

            let html = '<table>';
            // หัวตาราง (แถวแรก)
            html += '<thead><tr>';
            data[0].forEach(header => {
                html += `<th>${header || ''}</th>`;
            });
            html += '</tr></thead>';

            // ข้อมูล (แถวที่เหลือ)
            html += '<tbody>';
            for (let i = 1; i < data.length; i++) {
                html += '<tr>';
                data[i].forEach(cell => {
                    html += `<td>${cell || ''}</td>`;
                });
                html += '</tr>';
            }
            html += '</tbody></table>';

            document.getElementById('tableContainer').innerHTML = html;
        }

        // ============================================
        // โหลดอัตโนมัติเมื่อเปิดหน้า
        // ============================================
        window.onload = function() {
            loadData('بيانات الأعضاء');
        };
    </script>
</body>
</html>
